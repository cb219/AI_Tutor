<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Annotation spike</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <div id="stage">
        <img id="slide" src="/slide.png" alt="Lecture slide" />
        <svg id="overlay" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
      <p id="caption" aria-live="polite">Press Play. Tap any part of the slide to simulate a question.</p>
      <div id="controls">
        <button id="play" class="primary">▶ Play</button>
        <button id="back">⏮ Back</button>
        <button id="restart">↺ Restart</button>
        <label>Speed
          <select id="speed">
            <option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option>
          </select>
        </label>
        <button id="mute">🔊 Voice on</button>
        <button id="clear-answers">Clear answers</button>
        <label><input type="checkbox" id="boxes" /> Show element boxes</label>
        <span id="step"></span>
      </div>
      <pre id="log"></pre>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
